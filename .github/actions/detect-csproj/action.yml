name: "Detect .csproj Name"
description: "Finds the first *.csproj in a directory and outputs its base name and path."

inputs:
  directory:
    description: "Directory to search, relative to the working directory"
    required: false
    default: "."

outputs:
  csproj_name:
    description: "Base name of the first *.csproj found"
    value: ${{ steps.csproj.outputs.csproj_name }}
  csproj_path:
    description: "Path of the first *.csproj found, relative to the working directory"
    value: ${{ steps.csproj.outputs.csproj_path }}

runs:
  using: "composite"
  steps:
    - name: Get csproj name
      id: csproj
      shell: pwsh
      run: |
        $dir = "${{ inputs.directory }}"
        $item = Get-ChildItem -Path $dir -Filter *.csproj | Select-Object -First 1
        if (-not $item) { Write-Error "No .csproj found in $dir"; exit 1 }
        "csproj_name=$($item.BaseName)" >> $env:GITHUB_OUTPUT
        "csproj_path=$(Join-Path $dir $item.Name)" >> $env:GITHUB_OUTPUT
