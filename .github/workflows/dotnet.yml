# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore Zeepkist.LogicScripting/Zeepkist.LogicScripting.csproj
    - name: Build
      run: dotnet build Zeepkist.LogicScripting/Zeepkist.LogicScripting.csproj --no-restore --configuration Release
    - name: Build in-game tests
      run: dotnet build Zeepkist.LogicScripting.InGameTests/Zeepkist.LogicScripting.InGameTests.csproj --configuration Release
    - name: Test
      run: dotnet test Zeepkist.LogicScripting.Compiler.Tests/Zeepkist.LogicScripting.Compiler.Tests.csproj --configuration Release
    - name: Test mod
      run: dotnet test Zeepkist.LogicScripting.Tests/Zeepkist.LogicScripting.Tests.csproj --configuration Release
    - name: Test analyzers
      run: dotnet test Zeepkist.LogicScripting.Analyzers.Tests/Zeepkist.LogicScripting.Analyzers.Tests.csproj --configuration Release
    - name: Audit dependencies
      run: dotnet list Zeepkist.LogicScripting/Zeepkist.LogicScripting.csproj package --vulnerable --include-transitive
    - name: Upload build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Zeepkist.LogicScripting
        path: |
          Zeepkist.LogicScripting/bin/Release/net472/*.dll
          Zeepkist.LogicScripting/bin/Release/net472/*.pdb
        if-no-files-found: error
        retention-days: 14
