# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore Zeepkist.LogicScripting.csproj
    - name: Build
      run: dotnet build Zeepkist.LogicScripting.csproj --no-restore --configuration Release
    - name: Audit dependencies
      run: dotnet list Zeepkist.LogicScripting.csproj package --vulnerable --include-transitive
